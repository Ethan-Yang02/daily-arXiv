# Daily arXiv Agent Configuration

# 应用配置 / App settings
app:
  # 部署语言 / Deployment language: zh 或 en
  language: "zh"

arxiv:
  categories:
    - "cs.LG"
    - "cs.AI"
    - "cs.CV"

  keywords: []

  max_results: 100
  
  # 排序方式 / Sort by: submittedDate (提交日期) 或 relevance (相关性)
  sort_by: "submittedDate"
  
  # 排序顺序 / Sort order: descending 或 ascending
  sort_order: "descending"

  # arXiv API 请求配置 / API request settings
  delay_seconds: 15
  num_retries: 2

# 推送去重配置 / Push deduplication
dedupe:
  enabled: true
  state_path: "data/state/papers_state.json"
  keep_days: 180

llm_filter:
  enabled: true
  threshold: 0.65
  max_selected: 40
  fail_open: true
  topic: |
    我关注模型压缩、模型加速、高效多模态大模型、高效长上下文、推理加速、训练加速相关论文。

# LLM 配置 / LLM settings
llm:
  # 提供商 / Provider: openai, gemini, claude, deepseek, vllm
  provider: "deepseek"
  
  # OpenAI 配置 / OpenAI settings
  openai:
    api_key: ""  # 在 .env 文件中设置 / Set in .env file
    model: "gpt-4o-mini"  # gpt-4, gpt-4o, gpt-3.5-turbo
    base_url: ""  # 可选，用于代理或自定义端点 / Optional for proxy or custom endpoint
    temperature: 0.2
    max_tokens: 8192
  
  # Google Gemini 配置 / Google Gemini settings
  gemini:
    api_key: ""  # 在 .env 文件中设置 / Set in .env file
    model: "gemini-1.5-flash"  # gemini-pro, gemini-1.5-flash, gemini-1.5-pro
    temperature: 0.2
    max_tokens: 8192
  
  # Anthropic Claude 配置 / Anthropic Claude settings
  claude:
    api_key: ""  # 在 .env 文件中设置 / Set in .env file
    model: "claude-3-5-sonnet-20241022"  # claude-3-opus, claude-3-sonnet, claude-3-haiku
    temperature: 0.2
    max_tokens: 8192
  
  # DeepSeek 配置 / DeepSeek settings
  deepseek:
    api_key: ""  # 在 .env 文件中设置 / Set in .env file
    model: "deepseek-v4-pro"  # deepseek-chat, deepseek-coder
    base_url: "https://api.deepseek.com"
    temperature: 0.2
    max_tokens: 8192
  
  # vLLM（OpenAI 兼容 API）/ vLLM (OpenAI-compatible API)
  vllm:
    api_key: "EMPTY"  # vLLM 通常不需要 API Key / vLLM usually does not require a real API key
    model: "gpt-oss-120b"  # 你部署的模型名称 example: gpt-oss-120b
    base_url: "http://localhost:8000/v1"  # vLLM 服务地址 example: http://localhost:8000/v1
    temperature: 0.2
    max_tokens: 8192


# 调度配置 / Scheduler settings
scheduler:
  # 是否启用自动调度 / Enable automatic scheduling
  enabled: true
  
  # 运行时间（24小时制，HH:MM 格式）/ Run time (24-hour format, HH:MM)
  run_time: "09:00"
  
  # 时区 / Timezone
  timezone: "Asia/Shanghai"
  
  # 启动时是否立即运行一次 / Run once on startup
  run_on_start: true
  
  # 邮件通知配置（可选）/ Email notification settings (optional)
  notification:
    enabled: true
    email:
      smtp_server: "smtp.163.com"
      smtp_port: 465
      sender: "your_email@example.com"  # 发件人邮箱 / Sender email
      password: ""  # 在 .env 文件中设置 EMAIL_PASSWORD / Set EMAIL_PASSWORD in .env
      recipients:  # 收件人列表 / Recipient list
        - "your_recipient@example.com"
      on_success: true  # 成功时发送通知 / Notify on success
      on_failure: true  # 失败时发送通知 / Notify on failure

# 数据存储配置 / Data storage settings
storage:
  # 存储类型 / Storage type: json 或 sqlite
  type: "json"
  
  # JSON 存储路径 / JSON storage path
  json_path: "data/papers"
  
  # SQLite 数据库路径 / SQLite database path
  sqlite_path: "data/arxiv.db"
  
  # 保留历史数据的天数（0 表示永久保留）/ Retention days (0 means keep forever)
  retention_days: 5

# 日志配置 / Logging settings

# 可视化配置 / Visualization settings
viz:
  # 词云中文字体路径（留空则自动查找）/ Chinese font path for wordcloud (leave empty to auto-detect)
  font_path: ""
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/daily_arxiv.log"
  console: true


adaptive_fetch:
  enabled: true

  # 希望每天至少拿到多少篇“没 seen 过”的候选论文，之后再送进 LLM
  min_unseen_papers: 400

  # 每次向 arXiv 请求一页多少篇
  page_size: 50

  # 最多向后扫描多少篇，防止无限请求
  max_scan_results: 1000

  # 如果最近 2 天没有足够新论文，允许向前回溯多少天
  backfill_days: 3

  # arXiv 请求间隔，之前你遇到 429，所以这里保守一点
  delay_seconds: 30

  # 429/503 时不要疯狂重试
  num_retries: 1
